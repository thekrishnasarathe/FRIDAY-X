services:
  - type: web
    name: friday-x-backend
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OWNER_NAME
        value: Boss
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
